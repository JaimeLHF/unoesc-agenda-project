# Dispara a fila de lembretes por e-mail.
#
# Por que um cron aqui e não dentro do app: a máquina no Fly dorme quando
# ninguém acessa, e um agendador dentro do processo não roda enquanto ela está
# suspensa. A chamada de fora acorda o app e manda rodar.
#
# Precisa de dois segredos no repositório:
#   APP_URL   → https://unoesc-agenda.fly.dev
#   TASK_KEY  → o mesmo valor da variável TASK_KEY no Fly
name: Lembretes

on:
  schedule:
    # 12:00 UTC = 09:00 em Brasília. O aviso sai de manhã, para o prazo do dia
    # seguinte — cedo o bastante para ainda dar tempo de fazer.
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  enviar:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar a fila de lembretes
        run: |
          curl --fail --show-error --silent \
            -X POST "${{ secrets.APP_URL }}/api/tasks/reminders" \
            -H "X-Task-Key: ${{ secrets.TASK_KEY }}" \
            --max-time 120
