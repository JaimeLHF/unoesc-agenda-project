# Deploy no Fly.io. Ajuste `app` e `primary_region` antes do primeiro deploy.
#
#   fly launch --no-deploy        # cria o app com este arquivo
#   fly volumes create dados --size 1 --region gru
#   fly secrets set SESSION_SECRET="$(openssl rand -base64 32)"
#   fly deploy
#
# `gru` é São Paulo — o mais perto dos alunos e do Moodle da UNOESC.

app = "unoesc-agenda"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[env]
  APP_ENV = "production"
  DATABASE_PATH = "/data/agenda.db"
  FRONTEND_DIST = "/app/static"

# O SQLite exige que todas as requisições cheguem à mesma máquina com o mesmo
# disco. Uma instância só, sem auto-scale: duas máquinas significariam dois
# bancos divergentes. Para crescer além disso, o passo é trocar por Postgres,
# não subir mais réplicas.
[[mounts]]
  source = "dados"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # Uma máquina sempre de pé. Antes eram zero: a máquina suspendia quando
  # ninguém acessava e acordava em ~1s na primeira visita, o que mantinha a
  # conta perto de zero. O que mudou foi a notificação — o disparo das 7h nasce
  # do relógio, não de uma visita, e processo suspenso não olha relógio. Sem
  # isto, "Prova hoje" simplesmente não sai.
  #
  # Para voltar a escalar a zero: ponha `min_machines_running = 0`, configure o
  # secret `PUSH_CRON_TOKEN` e aponte um cron externo (cron-job.org, GitHub
  # Actions) para `POST /api/push/run?slot=manha|meio|noite` — a chamada acorda
  # a máquina e dispara. Fica mais barato e mais frágil, nessa ordem.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 40
    hard_limit = 60

  # Bate em `/api/health/live`, que não toca no Moodle nem no banco: um check a
  # cada 30s contra `/api/health` faria uma requisição ao Moodle da UNOESC 2880
  # vezes por dia sem ninguém estar usando o app. Se o processo travar, o Fly
  # reinicia a máquina sozinho — hoje ele nem saberia que travou.
  # Com a máquina de pé o check roda o dia inteiro — é o preço de manter o
  # relógio das notificações acordado, e ele não sai do nosso servidor.
  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/api/health/live"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
