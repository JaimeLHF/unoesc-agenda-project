<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    Mesmo símbolo da marca na barra superior: calendário com um traço de
    conferido. O emoji 📚 que estava aqui era desenhado pelo sistema operacional
    e não tinha relação nenhuma com o app na tela.

    Fundo sólido em vez de traço solto: na aba do navegador o ícone aparece em
    16px, e um desenho vazado some contra o fundo claro.
  -->
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="url(#fundo)" />
  <g
    transform="translate(4 4)"
    fill="none"
    stroke="#ffffff"
    stroke-width="2.1"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <rect x="3" y="4.5" width="18" height="16" rx="3" />
    <path d="M8 2.5v4M16 2.5v4M3 9.5h18" />
    <path d="m8.5 14.5 2.5 2.5 4.5-4.5" />
  </g>
</svg>
